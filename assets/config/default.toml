# The configuration linea starts from. linea.toml files merge over it:
# tables merge key by key, any other value replaces the one below it.

[line]
# Sections drawn, left to right.
sections = ["model", "effort", "project", "branch", "pane", "duration", "cache", "cache_misses", "context"]
separator = "  "
# Between a section's icon and its text.
gap = " "
# Columns kept free at the right edge of the terminal.
margin = 4

[appearance]
# auto follows the macOS appearance; dark or light pins one palette.
mode = "auto"

# Recessed doom-one and doom-one-light hues and greys, beside Claude Code's own orange.
[palette.dark]
orange = "#d77757"
blue = "#6f9cc4"
green = "#8aa36c"
red = "#b07c7a"
grey = "#7f858b"

[palette.light]
orange = "#d77757"
blue = "#5f82c4"
green = "#5f8f5e"
red = "#a8706b"
grey = "#8a8e93"

[sections.model]
icon = "\U000F035B"
colour = "orange"
fit = "always"

[sections.effort]
icon = "\U000F140B"
colour = "grey"
fit = 2

[sections.project]
icon = "\uEA83"
colour = "blue"
fit = 1

[sections.branch]
icon = "\uF126"
colour = "green"
fit = { rank = 3, grow = true, min = 24, requires = "project" }

[sections.pane]
icon = "\uEAE3"
colour = "grey"
fit = 4

[sections.duration]
icon = "\U000F051B"
colour = "grey"
fit = 5

[sections.cache]
icon = "\U000F162A"
colour = "grey"
fit = 6
format = "%d %b %H:%M"

[sections.cache_misses]
icon = "\U000F1635"
colour = "red"
fit = "always"

[sections.context]
colour = "grey"
fit = "always"

# A pie that fills by eighths, full only at 100%.
[sections.context.icon]
state = "context_window.used_percentage"
default = "\U000F0130"
at = { 0 = "\U000F0130", 7 = "\U000F0A9E", 19 = "\U000F0A9F", 32 = "\U000F0AA0", 44 = "\U000F0AA1", 57 = "\U000F0AA2", 69 = "\U000F0AA3", 82 = "\U000F0AA4", 100 = "\U000F0AA5" }

# The pane section shows only inside a running herdr.
[herdr]
enabled = true
inside = "HERDR_ENV"
pane = "HERDR_PANE_ID"
socket = "HERDR_SOCKET_PATH"

# Off by default. Enabled, a change in the text of a section with
# `emit = true` sends `body`, rendered as a template, to `command` on stdin;
# docs/events.md describes the protocol.
[events]
enabled = false
acknowledge = "exit"
retry = "30s"

# Where the effort level comes from when the session reports none.
[claude]
effort = "CLAUDE_CODE_EFFORT_LEVEL"
