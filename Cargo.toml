[package]
name = "linea"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "Claude Code status line"
license = "MIT"
repository = "https://github.com/srnnkls/linea"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
jiff = "0.2.38"
minijinja = { version = "3.0.5", features = ["json", "serde"] }
rustix = { version = "1.1.6", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

[profile.dist]
inherits = "release"

[package.metadata.dist]
dist = true

